name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Build both targets and package the artifacts
        run: npm run release

      - name: Verify the checksums
        working-directory: dist/release
        run: sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: histora-build
          path: dist/release/*
          if-no-files-found: error
